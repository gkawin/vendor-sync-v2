<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="theme-color" content="#16231B" />
<title>Coconut Corner — Staff</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Mitr:wght@400;500;600&family=Sarabun:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root{
    --iron:#16231B; --iron-2:#1F3128; --iron-line:#2C4234;
    --cream:#F6ECD6; --gold:#E7A544; --gold-deep:#C6802A;
    --pandan:#46A45E; --pandan-deep:#2F7A44; --sage-dim:#9DB3A4; --danger:#C4553C;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    background:radial-gradient(120% 80% at 50% -10%, #21362A 0%, var(--iron) 55%) fixed;
    color:var(--cream);font-family:"Sarabun",system-ui,sans-serif;-webkit-font-smoothing:antialiased;
    padding:max(16px,env(safe-area-inset-top)) 0 calc(24px + env(safe-area-inset-bottom));
  }
  .wrap{max-width:100%;margin:0}
  header{display:flex;align-items:center;justify-content:space-between;padding:2px 2px 18px}
  .brand{font-family:"Mitr";font-weight:500;font-size:1rem;letter-spacing:.4px}
  .brand small{display:block;font-family:"Sarabun";font-weight:400;font-size:.68rem;color:var(--sage-dim);letter-spacing:2px;text-transform:uppercase;margin-top:2px}
  .count{font-family:"Mitr";font-weight:600;font-size:1.6rem;color:var(--gold)}

  h2{font-family:"Mitr";font-weight:500;font-size:.8rem;letter-spacing:2px;text-transform:uppercase;color:var(--sage-dim);margin:22px 2px 12px}

  .row{
    display:flex;align-items:center;gap:14px;
    background:var(--iron-2);border:1px solid var(--iron-line);border-radius:16px;
    padding:12px 12px 12px 18px;margin-bottom:12px;
  }
  .tk{font-family:"Mitr";font-weight:600;font-size:1.9rem;line-height:1;min-width:2ch}
  .meta{flex:1;font-size:.82rem;color:var(--sage-dim)}
  .btn{
    font-family:"Mitr";font-weight:500;font-size:1rem;color:#20140A;
    background:linear-gradient(180deg,#F2B85A,var(--gold-deep));
    border:none;border-radius:13px;padding:15px 20px;cursor:pointer;
    box-shadow:0 3px 0 rgba(120,80,10,.5);transition:transform .06s,box-shadow .06s;
    -webkit-tap-highlight-color:transparent;
  }
  .btn:active{transform:translateY(2px);box-shadow:0 1px 0 rgba(120,80,10,.5)}
  .btn.ghost{
    background:transparent;color:var(--sage-dim);
    border:1px solid var(--iron-line);box-shadow:none;font-weight:400;font-family:"Sarabun";font-size:.9rem;padding:12px 16px;
  }
  .row.done{background:transparent;border-style:dashed}
  .row.done .tk{color:var(--gold)}

  .empty{color:var(--sage-dim);font-size:.9rem;padding:4px}

  /* PIN gate */
  #gate{position:fixed;inset:0;background:var(--iron);display:flex;align-items:center;justify-content:center;flex-direction:column;gap:18px;padding:24px;z-index:10}
  #gate h1{font-family:"Mitr";font-weight:500;font-size:1.2rem}
  #pin{font-family:"Mitr";font-size:1.6rem;text-align:center;letter-spacing:10px;width:220px;padding:14px;border-radius:14px;border:1px solid var(--iron-line);background:var(--iron-2);color:var(--cream)}
  #pin:focus{outline:2px solid var(--gold)}
  #gate .btn{width:220px;text-align:center}
  #gate .err{color:var(--danger);font-size:.85rem;height:1em}
</style>
</head>
<body>
<div id="gate">
  <h1>Staff</h1>
  <input id="pin" inputmode="numeric" placeholder="PIN" autocomplete="off" />
  <div class="err" id="err"></div>
  <button class="btn" id="enter">Enter</button>
</div>

<div class="wrap" id="app" hidden>
  <header>
    <div class="brand">Coconut Corner<small>Staff</small></div>
    <div class="count" id="count">0</div>
  </header>

  <h2>Making</h2>
  <div id="making"></div>
  <div class="empty" id="making-empty" hidden>No orders in the pan</div>

  <h2>Ready</h2>
  <div id="ready"></div>
  <div class="empty" id="ready-empty" hidden>Nothing ready yet</div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
  // ─── Fill in your details ───────────────────────────────────
  const SUPABASE_URL = "https://kbkrqqvxbligybvgtyxx.supabase.co";
  const SUPABASE_ANON = "sb_publishable_zmng-XP1Yfiox8ZPW5Wfsg_U1lQK2x3";
  const STAFF_PIN     = "2468";   // change this. Weak gate — see the note in chat.
  // ────────────────────────────────────────────────────────────

  const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON);

  // PIN gate
  const gate = document.getElementById("gate");
  document.getElementById("enter").onclick = tryPin;
  document.getElementById("pin").addEventListener("keydown", e=>{ if(e.key==="Enter") tryPin(); });
  function tryPin(){
    if(document.getElementById("pin").value === STAFF_PIN){
      gate.remove(); document.getElementById("app").hidden = false; start();
    } else {
      document.getElementById("err").textContent = "Wrong PIN";
    }
  }

  const makingEl = document.getElementById("making");
  const readyEl  = document.getElementById("ready");

  function waited(created){
    const m = Math.floor((Date.now()-new Date(created))/60000);
    return m<1 ? "just now" : `waiting ${m}m`;
  }

  async function setStatus(id, status){
    const patch = { status };
    if(status==="ready") patch.ready_at = new Date().toISOString();
    await sb.from("orders").update(patch).eq("id", id);
    load(); // optimistic-ish; realtime will also refresh
  }

  function render(el, rows, kind, emptyId){
    el.innerHTML = "";
    rows.forEach(r=>{
      const row = document.createElement("div");
      row.className = "row" + (kind==="ready" ? " done" : "");
      const tk = document.createElement("div"); tk.className="tk"; tk.textContent=r.ticket;
      const meta = document.createElement("div"); meta.className="meta";
      meta.textContent = kind==="ready" ? "ready" : waited(r.created_at);
      const btn = document.createElement("button");
      if(kind==="making"){
        btn.className="btn"; btn.textContent="Ready ✓";
        btn.onclick=()=>setStatus(r.id,"ready");
      } else {
        btn.className="btn ghost"; btn.textContent="Picked up";
        btn.onclick=()=>setStatus(r.id,"picked_up");
      }
      row.append(tk, meta, btn);
      el.appendChild(row);
    });
    document.getElementById(emptyId).hidden = rows.length>0;
  }

  async function load(){
    const { data, error } = await sb
      .from("orders")
      .select("id,ticket,status,created_at")
      .neq("status","picked_up")
      .gt("created_at", new Date(Date.now()-6*3600*1000).toISOString())
      .order("created_at",{ascending:true});
    if(error) return;
    const making = data.filter(r=>r.status==="preparing");
    const ready  = data.filter(r=>r.status==="ready");
    document.getElementById("count").textContent = making.length;
    render(makingEl, making, "making", "making-empty");
    render(readyEl,  ready,  "ready",  "ready-empty");
  }

  function start(){
    sb.channel("staff")
      .on("postgres_changes",{event:"*",schema:"public",table:"orders"}, load)
      .subscribe();
    load();
    setInterval(load, 30000); // refresh wait-times
  }
</script>
</body>
</html>
