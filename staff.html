<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="theme-color" content="#16231B" />
<title>Coconut Corner — Staff</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Mitr:wght@400;500;600&family=Sarabun:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root{
    --iron:#16231B; --iron-2:#1F3128; --iron-line:#2C4234;
    --cream:#F6ECD6; --gold:#E7A544; --gold-deep:#C6802A;
    --pandan:#46A45E; --pandan-deep:#2F7A44; --sage-dim:#9DB3A4; --danger:#C4553C;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    background:radial-gradient(120% 80% at 50% -10%, #21362A 0%, var(--iron) 55%) fixed;
    color:var(--cream);font-family:"Sarabun",system-ui,sans-serif;-webkit-font-smoothing:antialiased;
    padding:max(16px,env(safe-area-inset-top)) 16px calc(24px + env(safe-area-inset-bottom));
  }
  .wrap{max-width:100%;margin:0 auto}
  header{display:flex;align-items:center;justify-content:space-between;padding:2px 2px 18px}
  .brand{font-family:"Mitr";font-weight:500;font-size:1rem;letter-spacing:.4px}
  .brand small{display:block;font-family:"Sarabun";font-weight:400;font-size:.68rem;color:var(--sage-dim);letter-spacing:2px;text-transform:uppercase;margin-top:2px}
  .count{font-family:"Mitr";font-weight:600;font-size:1.6rem;color:var(--gold)}
  .hgroup{display:flex;align-items:center;gap:14px}
  .sound{
    flex:none;width:40px;height:40px;border-radius:12px;font-size:1.05rem;line-height:1;
    background:var(--iron-2);border:1px solid var(--iron-line);color:var(--cream);
    cursor:pointer;-webkit-tap-highlight-color:transparent;
  }
  .sound[aria-pressed="false"]{opacity:.5}
  .sound:active{transform:translateY(1px)}

  h2{font-family:"Mitr";font-weight:500;font-size:.8rem;letter-spacing:2px;text-transform:uppercase;color:var(--sage-dim);margin:22px 2px 12px}
  h2 .badge{
    display:inline-block;margin-left:8px;padding:2px 9px;border-radius:999px;
    background:var(--gold);color:#20140A;font-weight:600;font-size:.75rem;
    letter-spacing:0;vertical-align:middle;
  }
  h2 .badge[hidden]{display:none}   /* the display above would beat [hidden] otherwise */

  .row{
    display:flex;align-items:center;gap:14px;
    background:var(--iron-2);border:1px solid var(--iron-line);border-radius:16px;
    padding:12px 12px 12px 18px;margin-bottom:12px;
  }
  .tk{font-family:"Mitr";font-weight:600;font-size:1.9rem;line-height:1;min-width:2ch;align-self:flex-start;padding-top:2px}
  .meta{flex:1;min-width:0}

  /* order contents as a tick-off checklist */
  .items{list-style:none;display:flex;flex-direction:column;gap:2px;margin-bottom:6px}
  .items li{
    display:flex;align-items:center;gap:9px;
    font-size:1rem;line-height:1.2;color:var(--cream);font-weight:600;
    padding:7px 8px;border-radius:9px;cursor:pointer;user-select:none;
    -webkit-tap-highlight-color:transparent;
  }
  .items li:active{background:rgba(255,255,255,.05)}
  .items .box{
    flex:none;width:22px;height:22px;border-radius:7px;
    border:2px solid var(--sage-dim);display:flex;align-items:center;justify-content:center;
    font-size:.9rem;color:transparent;transition:background .12s,border-color .12s;
  }
  .items li.done .box{background:var(--pandan);border-color:var(--pandan);color:#0E1A12}
  .items li.done .txt{color:var(--sage-dim);text-decoration:line-through}
  .items li.done .q{color:var(--sage-dim)}
  .items .q{color:var(--gold);margin-right:1px}
  .items.none{color:var(--sage-dim);font-weight:400;font-size:.9rem;padding-left:2px}
  /* ready rows: show the list as a plain confirmation, no tapping */
  .items.readonly li{cursor:default;padding:2px 0}
  .items.readonly .box{display:none}
  .wait{font-size:.78rem;color:var(--sage-dim)}
  .prog{color:var(--gold);font-weight:600}
  .prog.all{color:var(--pandan)}

  .btn{
    font-family:"Mitr";font-weight:500;font-size:1rem;color:#20140A;align-self:center;
    background:linear-gradient(180deg,#F2B85A,var(--gold-deep));
    border:none;border-radius:13px;padding:15px 20px;cursor:pointer;flex:none;
    box-shadow:0 3px 0 rgba(120,80,10,.5);transition:transform .06s,box-shadow .06s;
    -webkit-tap-highlight-color:transparent;
  }
  .btn:active{transform:translateY(2px);box-shadow:0 1px 0 rgba(120,80,10,.5)}
  .btn.ghost{
    background:transparent;color:var(--sage-dim);
    border:1px solid var(--iron-line);box-shadow:none;font-weight:400;font-family:"Sarabun";font-size:.9rem;padding:12px 16px;
  }
  .actions{display:flex;align-items:center;gap:10px;flex:none;align-self:center}
  .btn.back{
    background:transparent;color:var(--sage-dim);
    border:1px solid var(--iron-line);box-shadow:none;
    width:44px;height:44px;padding:0;border-radius:12px;
    font-size:1.25rem;display:flex;align-items:center;justify-content:center;
  }
  .btn.back:active{transform:translateY(1px);box-shadow:none}
  .row.done{background:transparent;border-style:dashed}
  .row.done .tk{color:var(--gold)}

  /* Incoming: straight from Square, waiting for a cashier to hand over a card.
     No .tk — the card-number box stands in for it. */
  .row.new{flex-wrap:wrap;border-color:var(--gold-deep)}
  .accept{display:flex;align-items:center;gap:10px;flex:none;align-self:center}
  .cardno{
    font-family:"Mitr";font-weight:600;font-size:1.5rem;text-align:center;color:var(--cream);
    width:4.5ch;padding:11px 6px;border-radius:12px;
    border:1px solid var(--iron-line);background:var(--iron);
  }
  .cardno:focus{outline:2px solid var(--gold);border-color:transparent}
  .cardno.bad{border-color:var(--danger);background:rgba(196,85,60,.12)}
  .conflict{
    flex-basis:100%;display:flex;align-items:center;gap:12px;flex-wrap:wrap;
    margin-top:12px;padding-top:11px;border-top:1px solid var(--iron-line);
    color:var(--danger);font-size:.85rem;line-height:1.35;
  }
  .conflict[hidden]{display:none}
  .conflict .btn{font-size:.85rem;padding:9px 14px}

  .empty{color:var(--sage-dim);font-size:.9rem;padding:4px}

  /* transient undo bar after Picked up */
  #undo[hidden]{display:none}          /* ID selector on #undo below beats [hidden] otherwise */
  #undo{
    position:fixed;left:50%;transform:translateX(-50%);
    bottom:calc(16px + env(safe-area-inset-bottom));
    width:min(440px,calc(100% - 32px));z-index:20;overflow:hidden;
    display:flex;align-items:center;gap:12px;
    background:var(--iron-2);border:1px solid var(--iron-line);
    border-radius:14px;padding:14px 14px 16px;
    box-shadow:0 10px 28px rgba(0,0,0,.45);
  }
  #undo-text{flex:1;font-size:.95rem;color:var(--cream)}
  #undo-btn{
    font-family:"Mitr";font-weight:500;font-size:.95rem;color:#20140A;flex:none;
    background:linear-gradient(180deg,#F2B85A,var(--gold-deep));
    border:none;border-radius:11px;padding:11px 18px;cursor:pointer;
    -webkit-tap-highlight-color:transparent;
  }
  #undo-btn:active{transform:translateY(1px)}
  #undo-bar{position:absolute;left:0;bottom:0;height:3px;width:100%;background:var(--pandan)}
  #undo.run #undo-bar{animation:undocount 10s linear forwards}
  @keyframes undocount{from{width:100%}to{width:0%}}
  @media (prefers-reduced-motion:reduce){ #undo.run #undo-bar{animation:none;width:0} }

  /* Cancelled-order alert — blocking on purpose. No close button, no backdrop
     tap: the customer is walking off with a queue card and someone has to go
     and get it. `locked` stops the list behind it scrolling under the sheet. */
  html.locked, html.locked body{overflow:hidden}
  #cancel[hidden]{display:none}
  #cancel{
    position:fixed;inset:0;z-index:40;
    display:flex;align-items:center;justify-content:center;
    padding:max(16px,env(safe-area-inset-top)) 16px calc(16px + env(safe-area-inset-bottom));
    background:rgba(8,14,10,.9);
  }
  #cancel .sheet{
    width:min(460px,100%);max-height:100%;overflow:auto;
    background:var(--iron-2);border:2px solid var(--danger);border-radius:20px;
    padding:20px;box-shadow:0 18px 50px rgba(0,0,0,.55);
  }
  #cancel .tag{
    display:inline-block;padding:4px 12px;border-radius:999px;
    background:var(--danger);color:#fff;font-family:"Mitr";font-weight:500;
    font-size:.72rem;letter-spacing:2px;text-transform:uppercase;
  }
  #cancel h3{font-family:"Mitr";font-weight:500;font-size:1.3rem;margin:13px 0 5px}
  #cancel .sub{color:var(--sage-dim);font-size:.88rem;line-height:1.45}
  #cancel .card{
    display:flex;align-items:center;gap:14px;margin:16px 0 14px;
    background:var(--iron);border:1px dashed var(--danger);border-radius:16px;padding:13px 16px;
  }
  #cancel .card .lbl{flex:1;font-size:.85rem;line-height:1.3;color:var(--sage-dim)}
  #cancel .card .no{font-family:"Mitr";font-weight:600;font-size:3rem;line-height:1;color:var(--gold)}
  #cancel .items{margin-bottom:14px}
  #cancel .more{font-size:.8rem;color:var(--gold);margin-bottom:12px}
  #cancel .more[hidden]{display:none}
  #cancel .err{color:var(--danger);font-size:.85rem;min-height:1.1em;margin-bottom:8px}
  #cancel-ok{
    width:100%;font-family:"Mitr";font-weight:500;font-size:1rem;line-height:1.35;
    color:#fff;background:linear-gradient(180deg,#D4614A,#A8422C);
    border:none;border-radius:14px;padding:16px 18px;cursor:pointer;
    box-shadow:0 3px 0 rgba(90,30,18,.6);transition:transform .06s,box-shadow .06s;
    -webkit-tap-highlight-color:transparent;
  }
  #cancel-ok:active{transform:translateY(2px);box-shadow:0 1px 0 rgba(90,30,18,.6)}
  #cancel-ok:disabled{opacity:.55}

  /* PIN gate */
  #gate{position:fixed;inset:0;background:var(--iron);display:flex;align-items:center;justify-content:center;flex-direction:column;gap:18px;padding:24px;z-index:10}
  #gate h1{font-family:"Mitr";font-weight:500;font-size:1.2rem}
  #pin{font-family:"Mitr";font-size:1.6rem;text-align:center;letter-spacing:10px;width:220px;padding:14px;border-radius:14px;border:1px solid var(--iron-line);background:var(--iron-2);color:var(--cream)}
  #pin:focus{outline:2px solid var(--gold)}
  #gate .btn{width:220px;text-align:center}
  #gate .err{color:var(--danger);font-size:.85rem;height:1em}
</style>
</head>
<body>
<div id="gate">
  <h1>Staff</h1>
  <input id="pin" inputmode="numeric" placeholder="PIN" autocomplete="off" />
  <div class="err" id="err"></div>
  <button class="btn" id="enter">Enter</button>
</div>

<div class="wrap" id="app" hidden>
  <header>
    <div class="brand">Coconut Corner<small>Staff</small></div>
    <div class="hgroup">
      <button class="sound" id="sound" aria-pressed="true">🔔</button>
      <div class="count" id="count">0</div>
    </div>
  </header>

  <h2>Incoming <span class="badge" id="incoming-count" hidden>0</span></h2>
  <div id="incoming"></div>
  <div class="empty" id="incoming-empty" hidden>Nothing waiting for a card</div>

  <h2>Making</h2>
  <div id="making"></div>
  <div class="empty" id="making-empty" hidden>No orders in the pan</div>

  <h2>Ready</h2>
  <div id="ready"></div>
  <div class="empty" id="ready-empty" hidden>Nothing ready yet</div>
</div>

<!-- Cancelled in Square. Blocks the screen until staff confirm the card is back;
     the only way out is the button, which records the acknowledgement. -->
<div id="cancel" hidden role="alertdialog" aria-modal="true" aria-labelledby="cancel-title">
  <div class="sheet">
    <span class="tag" id="cancel-reason">Order cancelled</span>
    <h3 id="cancel-title">This order was cancelled</h3>
    <div class="sub">Square voided, refunded or returned it. Stop making it — and take the queue card back from the customer.</div>
    <div class="card">
      <span class="lbl">Get this card back</span>
      <span class="no" id="cancel-card">—</span>
    </div>
    <div id="cancel-items"></div>
    <div class="more" id="cancel-more" hidden></div>
    <div class="err" id="cancel-err"></div>
    <button id="cancel-ok">Already got the order number card from customer!</button>
  </div>
</div>

<!-- transient "picked up — undo" bar -->
<div id="undo" hidden>
  <span id="undo-text"></span>
  <button id="undo-btn">Undo</button>
  <div id="undo-bar"></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
  // ─── Fill in your details ───────────────────────────────────
  const SUPABASE_URL = "https://kbkrqqvxbligybvgtyxx.supabase.co";
  const SUPABASE_ANON = "sb_publishable_zmng-XP1Yfiox8ZPW5Wfsg_U1lQK2x3";
  const STAFF_PIN     = "2468";   // change this. Weak gate — see the note in chat.
  // ────────────────────────────────────────────────────────────

  const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON);

  // ── Chime when an order lands in Incoming ─────────────────────────
  // Synthesised with WebAudio rather than an <audio src>: Pages serves this
  // repo as-is, so this keeps the page a single self-contained file.
  // Browsers won't make noise before a gesture — the PIN tap unlocks it.
  let audio = null;
  let soundOn = localStorage.getItem("staff-sound") !== "off";

  function unlockAudio(){
    const AC = window.AudioContext || window.webkitAudioContext;
    if(!audio && AC) audio = new AC();
    if(audio) audio.resume().catch(()=>{});
  }

  function chime(){
    if(!soundOn || !audio) return;
    audio.resume().catch(()=>{});          // a backgrounded tab gets suspended
    const t0 = audio.currentTime + 0.02;
    [[784, 0], [1175, 0.17]].forEach(([hz, at])=>{   // G5 → D6, two-note bell
      const t = t0 + at;
      const osc = audio.createOscillator(), gain = audio.createGain();
      osc.type = "sine"; osc.frequency.value = hz;
      gain.gain.setValueAtTime(0.0001, t);
      gain.gain.exponentialRampToValueAtTime(0.25, t + 0.015);
      gain.gain.exponentialRampToValueAtTime(0.0001, t + 0.45);
      osc.connect(gain).connect(audio.destination);
      osc.start(t); osc.stop(t + 0.5);
    });
  }

  // Cancelled order: harder, lower and repeating, so it can't be mistaken for
  // the Incoming bell. This one means "go and catch the customer".
  function alarm(){
    if(!soundOn || !audio) return;
    audio.resume().catch(()=>{});
    const t0 = audio.currentTime + 0.02;
    [0, 0.26, 0.52].forEach(rep=>{
      [[622, 0], [466, 0.13]].forEach(([hz, at])=>{
        const t = t0 + rep + at;
        const osc = audio.createOscillator(), gain = audio.createGain();
        osc.type = "triangle"; osc.frequency.value = hz;
        gain.gain.setValueAtTime(0.0001, t);
        gain.gain.exponentialRampToValueAtTime(0.3, t + 0.01);
        gain.gain.exponentialRampToValueAtTime(0.0001, t + 0.12);
        osc.connect(gain).connect(audio.destination);
        osc.start(t); osc.stop(t + 0.15);
      });
    });
  }

  const soundBtn = document.getElementById("sound");
  function paintSound(){
    soundBtn.textContent = soundOn ? "🔔" : "🔕";
    soundBtn.setAttribute("aria-pressed", String(soundOn));
    soundBtn.title = soundOn ? "Sound on — tap to mute" : "Muted — tap for sound";
    soundBtn.setAttribute("aria-label", soundBtn.title);
  }
  soundBtn.onclick = ()=>{
    soundOn = !soundOn;
    try{ localStorage.setItem("staff-sound", soundOn ? "on" : "off"); }catch(e){}
    paintSound();
    if(soundOn){ unlockAudio(); chime(); }   // let staff hear the volume
  };
  paintSound();

  // Ids already chimed for. Rebuilt from every load(), so it stays bounded and
  // a row that ages out of the 6h window can't linger in it. Stays null until
  // the first load() so the backlog on screen at sign-in doesn't ring.
  let seenNew = null;
  function ringForNew(incoming){
    const ids = new Set(incoming.map(r=>r.id));
    if(seenNew && incoming.some(r=>!seenNew.has(r.id))) chime();
    seenNew = ids;
  }

  // PIN gate
  const gate = document.getElementById("gate");
  document.getElementById("enter").onclick = tryPin;
  document.getElementById("pin").addEventListener("keydown", e=>{ if(e.key==="Enter") tryPin(); });
  function tryPin(){
    if(document.getElementById("pin").value === STAFF_PIN){
      gate.remove(); document.getElementById("app").hidden = false;
      unlockAudio();   // this click is the gesture the browser wants
      start();
    } else {
      document.getElementById("err").textContent = "Wrong PIN";
    }
  }

  const incomingEl = document.getElementById("incoming");
  const makingEl   = document.getElementById("making");
  const readyEl    = document.getElementById("ready");

  function waited(created){
    const m = Math.floor((Date.now()-new Date(created))/60000);
    return m<1 ? "just now" : `waiting ${m}m`;
  }

  // Line up the checked-state array with the items array (missing = not done).
  function normChecked(row){
    const n = Array.isArray(row.items) ? row.items.length : 0;
    const c = Array.isArray(row.checked) ? row.checked.slice(0, n) : [];
    while(c.length < n) c.push(false);
    return c;
  }

  function writeProgress(el, row){
    const n = Array.isArray(row.items) ? row.items.length : 0;
    if(!n){ el.textContent = ""; el.classList.remove("all"); return; }
    const done = normChecked(row).filter(Boolean).length;
    el.textContent = `${done}/${n} in`;
    el.classList.toggle("all", done === n);
  }

  // Tap an item to mark it added; write-through to the DB so every device syncs.
  async function toggleItem(row, idx, liEl){
    const checked = normChecked(row);
    checked[idx] = !checked[idx];
    row.checked = checked;                                  // keep local copy fresh
    liEl.classList.toggle("done", checked[idx]);            // optimistic
    const prog = liEl.closest(".row")?.querySelector(".prog");
    if(prog) writeProgress(prog, row);
    const { error } = await sb.from("orders").update({ checked }).eq("id", row.id);
    if(error) liEl.classList.toggle("done", !checked[idx]); // revert if it didn't save
  }

  // The order contents, as a tick-off checklist (interactive only while making).
  function itemsBlock(row, interactive){
    const items = Array.isArray(row.items) ? row.items : [];
    const ul = document.createElement("ul");
    if(!items.length){
      ul.className = "items none";
      const li = document.createElement("li"); li.textContent = "—";
      ul.appendChild(li);
      return ul;
    }
    ul.className = "items" + (interactive ? "" : " readonly");
    const checked = normChecked(row);
    items.forEach((it, i)=>{
      const li = document.createElement("li");
      if(checked[i]) li.classList.add("done");
      const box = document.createElement("span"); box.className="box"; box.textContent="✓";
      const q = document.createElement("span"); q.className="q"; q.textContent=(it.qty ?? 1)+"×";
      const txt = document.createElement("span"); txt.className="txt"; txt.textContent=" "+(it.name ?? "Item");
      li.append(box, q, txt);
      if(interactive) li.onclick = ()=> toggleItem(row, i, li);
      ul.appendChild(li);
    });
    return ul;
  }

  // ── Queue cards ───────────────────────────────────────────────────
  // Physical numbered cards, 1–100. A card is "out" for exactly as long as its
  // number sits on an active row, so the same number can never be handed to two
  // customers. `orders_active_ticket_idx` enforces that in the database — the
  // checks here only make the failure legible; they don't guard anything.
  const CARD_MIN = 1, CARD_MAX = 100;

  // "07" and "7" are the same physical card — store one spelling, or the unique
  // index happily lets both exist.
  function normCard(raw){
    const s = String(raw ?? "").trim();
    if(!/^\d{1,3}$/.test(s)) return null;
    const n = Number(s);
    return (n >= CARD_MIN && n <= CARD_MAX) ? String(n) : null;
  }

  // Conflicts live outside the DOM: load() re-renders on every realtime event,
  // and a "that card is still out" message that vanished a second later would
  // be worse than none.
  const conflicts = new Map();   // incoming row id → { text, holderId }

  function fillConflict(el, rowId){
    const c = conflicts.get(rowId);
    if(!c){ el.hidden = true; el.innerHTML = ""; return; }
    el.innerHTML = "";
    const span = document.createElement("span"); span.textContent = c.text;
    el.appendChild(span);
    if(c.holderId){
      const b = document.createElement("button");
      b.className = "btn ghost"; b.textContent = "Release card";
      b.onclick = async ()=>{
        await sb.from("orders").update({ status:"picked_up" }).eq("id", c.holderId);
        conflicts.delete(rowId);
        load();
      };
      el.appendChild(b);
    }
    el.hidden = false;
  }

  // The number came back as taken. Usually the holder is right there in Making
  // or Ready — but it can also be a row that aged past load()'s 6h window and
  // went invisible, which would strand that card number forever. Look it up
  // with no time filter and offer to write it off.
  async function findHolder(card){
    const { data } = await sb
      .from("orders")
      .select("id,created_at,accepted_at")
      .eq("ticket", card)
      .in("status",["new","preparing","ready"])
      .limit(1);
    return (data && data[0]) || null;
  }

  async function accept(row, input, msgEl){
    const card = normCard(input.value);
    if(!card){
      conflicts.set(row.id, { text:`Card number must be ${CARD_MIN}–${CARD_MAX}` });
      fillConflict(msgEl, row.id);
      input.classList.add("bad"); input.focus(); input.select();
      return;
    }
    const { error } = await sb
      .from("orders")
      .update({ ticket: card, status: "preparing", accepted_at: new Date().toISOString() })
      .eq("id", row.id);

    if(!error){
      conflicts.delete(row.id);
      load();
      return;
    }
    input.classList.add("bad");
    if(error.code === "23505"){          // unique index: that card is still out
      const holder = await findHolder(card);
      const when = holder
        ? new Date(holder.accepted_at || holder.created_at)
            .toLocaleTimeString([], { hour:"2-digit", minute:"2-digit" })
        : null;
      conflicts.set(row.id, {
        text: when
          ? `Card ${card} is still out — handed over at ${when}. Release it only if that customer has gone.`
          : `Card ${card} is already taken.`,
        holderId: holder ? holder.id : null,
      });
    } else {
      conflicts.set(row.id, { text:"Couldn't save — check the connection and try again" });
    }
    fillConflict(msgEl, row.id);
  }

  function renderIncoming(rows){
    // load() fires on every realtime event and every 30s. Snapshot whatever is
    // half-typed, and where the caret is, so a re-render can't eat it.
    const typed = {};
    let focusedId = null, caret = null;
    incomingEl.querySelectorAll(".cardno").forEach(inp=>{
      typed[inp.dataset.id] = inp.value;
      if(document.activeElement === inp){
        focusedId = inp.dataset.id; caret = inp.selectionStart;
      }
    });

    incomingEl.innerHTML = "";
    rows.forEach(r=>{
      const row = document.createElement("div");
      row.className = "row new";

      const meta = document.createElement("div"); meta.className="meta";
      meta.appendChild(itemsBlock(r, false));   // nothing to tick until it's accepted
      const wait = document.createElement("div"); wait.className="wait";
      wait.textContent = waited(r.created_at);
      meta.appendChild(wait);

      const msg = document.createElement("div"); msg.className="conflict"; msg.hidden = true;

      const input = document.createElement("input");
      input.className="cardno"; input.type="text"; input.inputMode="numeric";
      input.maxLength=3; input.placeholder="#"; input.autocomplete="off";
      input.dataset.id = r.id;
      input.setAttribute("aria-label","Queue card number");
      // Square's ticket_name only ever prefills; the cashier types the real card.
      input.value = (r.id in typed) ? typed[r.id] : (r.square_ticket || r.ticket || "");
      input.addEventListener("input", ()=>{
        input.classList.remove("bad");
        if(conflicts.delete(r.id)) fillConflict(msg, r.id);
      });

      const btn = document.createElement("button");
      btn.className="btn"; btn.textContent="Accept";
      const go = ()=> accept(r, input, msg);
      btn.onclick = go;
      input.addEventListener("keydown", e=>{ if(e.key==="Enter") go(); });

      const box = document.createElement("div"); box.className="accept";
      box.append(input, btn);

      fillConflict(msg, r.id);
      row.append(meta, box, msg);
      incomingEl.appendChild(row);
    });

    if(focusedId){
      const back = incomingEl.querySelector('.cardno[data-id="'+focusedId+'"]');
      if(back){ back.focus(); if(caret != null) back.setSelectionRange(caret, caret); }
    }

    document.getElementById("incoming-empty").hidden = rows.length > 0;
    const badge = document.getElementById("incoming-count");
    badge.textContent = rows.length;
    badge.hidden = rows.length === 0;
  }

  async function setStatus(id, status){
    const patch = { status };
    if(status==="ready")     patch.ready_at = new Date().toISOString();
    if(status==="preparing") patch.ready_at = null;   // sent back to the pan
    await sb.from("orders").update(patch).eq("id", id);
    load(); // optimistic-ish; realtime will also refresh
  }

  // ── Undo for an accidental "Picked up" ────────────────────────────
  // The pickup writes to the DB immediately (so every device agrees), and this
  // bar hangs around ~10s offering to flip it back to Ready.
  let undoTimer = null;
  const undoEl = document.getElementById("undo");
  function showUndo(id, ticket){
    clearTimeout(undoTimer);
    undoEl.dataset.id = id;
    document.getElementById("undo-text").textContent = `Ticket ${ticket} picked up`;
    undoEl.hidden = false;
    undoEl.classList.remove("run"); void undoEl.offsetWidth; // restart the countdown bar
    undoEl.classList.add("run");
    undoTimer = setTimeout(hideUndo, 10000);
  }
  function hideUndo(){
    clearTimeout(undoTimer);
    undoEl.classList.remove("run");
    undoEl.hidden = true;
    delete undoEl.dataset.id;
  }
  async function undoPickup(){
    const id = undoEl.dataset.id;
    hideUndo();
    if(id) await setStatus(id, "ready");   // back into the Ready list
  }
  document.getElementById("undo-btn").onclick = undoPickup;

  // ── Cancelled in Square (void / refund / return) ──────────────────
  // The webhook takes these off the board by itself — which also frees the
  // queue-card number for the next customer immediately — but the physical
  // card is still in someone's hand. It stamps `canceled_at` on any row that
  // had a card out, and this alert then blocks the whole screen until a staff
  // member confirms they got it back. Deliberately no close button, no
  // backdrop tap and no Escape: acknowledging writes `cancel_ack_at`, which is
  // what clears it — on every signed-in device at once, not just this one.
  const cancelEl    = document.getElementById("cancel");
  const cancelOk    = document.getElementById("cancel-ok");
  const cancelErr   = document.getElementById("cancel-err");
  const cancelMore  = document.getElementById("cancel-more");
  const CANCEL_LABEL = {
    canceled: "Order cancelled",
    refunded: "Refunded",
    returned: "Returned / exchanged",
  };

  let cancelQueue = [];    // unacknowledged rows, oldest first — one on screen at a time
  let seenCancel  = null;  // ids already alarmed for; starts null like seenNew

  function alarmForCancels(rows){
    const ids = new Set(rows.map(r=>r.id));
    if(seenCancel && rows.some(r=>!seenCancel.has(r.id))) alarm();
    seenCancel = ids;
  }

  // Its own query: these rows are 'picked_up', so load()'s status filter can
  // never see them. Same 6h horizon, measured from the cancellation — an
  // alert nobody acknowledged before closing up doesn't greet the next shift.
  async function loadCancels(){
    const { data, error } = await sb
      .from("orders")
      .select("id,ticket,items,cancel_reason,canceled_at")
      .not("canceled_at","is",null)
      .is("cancel_ack_at",null)
      .gt("canceled_at", new Date(Date.now()-6*3600*1000).toISOString())
      .order("canceled_at",{ascending:true});
    if(error) return;              // leave whatever is on screen alone
    cancelQueue = data;
    alarmForCancels(data);
    renderCancel();
  }

  function renderCancel(){
    const row = cancelQueue[0];
    if(!row){
      cancelEl.hidden = true;
      delete cancelEl.dataset.id;
      document.documentElement.classList.remove("locked");
      return;
    }
    const rest = cancelQueue.length - 1;
    cancelMore.textContent = `+ ${rest} more cancelled order${rest>1?"s":""} after this`;
    cancelMore.hidden = rest < 1;

    // Already showing this one: stop here. load() re-runs on every realtime
    // event, and rebuilding would wipe a failed-save message mid-read.
    if(cancelEl.dataset.id === row.id) return;

    cancelEl.dataset.id = row.id;
    cancelErr.textContent = "";
    cancelOk.disabled = false;
    document.getElementById("cancel-reason").textContent =
      CANCEL_LABEL[row.cancel_reason] || CANCEL_LABEL.canceled;
    document.getElementById("cancel-card").textContent = row.ticket ?? "—";
    const items = document.getElementById("cancel-items");
    items.innerHTML = "";
    items.appendChild(itemsBlock(row, false));   // nothing to tick — it's off
    cancelEl.hidden = false;
    document.documentElement.classList.add("locked");
  }

  cancelOk.onclick = async ()=>{
    const id = cancelEl.dataset.id;
    if(!id) return;
    cancelOk.disabled = true;
    const { error } = await sb
      .from("orders")
      .update({ cancel_ack_at: new Date().toISOString() })
      .eq("id", id);
    cancelOk.disabled = false;
    if(error){
      // Never dismiss on a failed write. The recorded acknowledgement is the
      // whole point, and it's the only thing that clears this for everyone.
      cancelErr.textContent = "Couldn't save — check the connection and tap again";
      return;
    }
    cancelQueue = cancelQueue.filter(r=>r.id !== id);
    delete cancelEl.dataset.id;   // force a rebuild for the next one in the queue
    renderCancel();
  };

  function render(el, rows, kind, emptyId){
    el.innerHTML = "";
    rows.forEach(r=>{
      const row = document.createElement("div");
      row.className = "row" + (kind==="ready" ? " done" : "");

      const tk = document.createElement("div"); tk.className="tk"; tk.textContent=r.ticket;

      const meta = document.createElement("div"); meta.className="meta";
      meta.appendChild(itemsBlock(r, kind==="making"));   // tap-to-check only while making
      const wait = document.createElement("div"); wait.className="wait";
      const prog = document.createElement("span"); prog.className="prog"; writeProgress(prog, r);
      if(prog.textContent){ wait.append(prog, document.createTextNode(" · ")); }
      wait.append(document.createTextNode(kind==="ready" ? "ready" : waited(r.created_at)));
      meta.appendChild(wait);

      if(kind==="making"){
        const btn = document.createElement("button");
        btn.className="btn"; btn.textContent="Ready ✓";
        btn.onclick=()=>setStatus(r.id,"ready");
        row.append(tk, meta, btn);
      } else {
        // Ready row: small "undo" to send it back to Making if marked by mistake,
        // plus the usual Picked up. Kept visually distinct to avoid mis-taps.
        const actions = document.createElement("div"); actions.className="actions";
        const back = document.createElement("button");
        back.className="btn back"; back.textContent="↩";
        back.setAttribute("aria-label","Back to making"); back.title="Back to making";
        back.onclick=()=>setStatus(r.id,"preparing");
        const picked = document.createElement("button");
        picked.className="btn ghost"; picked.textContent="Picked up";
        picked.onclick=()=>{ setStatus(r.id,"picked_up"); showUndo(r.id, r.ticket); };
        actions.append(back, picked);
        row.append(tk, meta, actions);
      }
      el.appendChild(row);
    });
    document.getElementById(emptyId).hidden = rows.length>0;
  }

  async function load(){
    loadCancels();   // independent query, runs alongside this one — see above
    const { data, error } = await sb
      .from("orders")
      .select("id,ticket,square_ticket,status,created_at,items,checked")
      .in("status",["new","preparing","ready"])
      .gt("created_at", new Date(Date.now()-6*3600*1000).toISOString())
      .order("created_at",{ascending:true});
    if(error) return;
    const incoming = data.filter(r=>r.status==="new");
    const making   = data.filter(r=>r.status==="preparing");
    const ready    = data.filter(r=>r.status==="ready");
    document.getElementById("count").textContent = making.length;  // the kitchen's number
    ringForNew(incoming);
    renderIncoming(incoming);
    render(makingEl, making, "making", "making-empty");
    render(readyEl,  ready,  "ready",  "ready-empty");
  }

  function start(){
    sb.channel("staff")
      .on("postgres_changes",{event:"*",schema:"public",table:"orders"}, load)
      .subscribe();
    load();
    setInterval(load, 30000); // refresh wait-times
  }
</script>
</body>
</html>
